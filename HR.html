<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e8f0fe 0%, #d4e0f0 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 20px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 1100px;
            overflow-x: auto;
        }
        h1 { text-align: center; color: #1a3c5e; margin-bottom: 25px; }
        .login-form {
            max-width: 380px;
            margin: 0 auto 30px;
            background: #f7faff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .login-form label { display: block; font-weight: 500; margin-bottom: 5px; }
        .login-form input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 16px;
            border: 2px solid #dce4ec;
            border-radius: 8px;
            font-size: 1rem;
            transition: 0.2s;
        }
        .login-form input:focus {
            outline: none;
            border-color: #2a6b9e;
        }
        .login-form button {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #1a3c5e, #2a6b9e);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .login-form button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(26,60,94,0.3);
        }
        .login-form button:disabled { opacity: 0.7; cursor: not-allowed; }
        .error-msg {
            color: #b22234;
            background: #ffe6e6;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
            display: none;
            border-left: 4px solid #b22234;
        }
        .success-msg {
            color: #0d6e3e;
            background: #e6f7ed;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
            display: none;
            border-left: 4px solid #0d6e3e;
        }
        .logout-btn, .refresh-btn {
            padding: 8px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
        }
        .logout-btn { background: #6c7a89; color: white; }
        .logout-btn:hover { background: #4a5a6b; }
        .refresh-btn { background: #2a7faa; color: white; margin-right: 10px; }
        .refresh-btn:hover { background: #1a5f7a; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            margin-top: 10px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        th {
            background: #1a3c5e;
            color: white;
            padding: 14px 10px;
            text-align: left;
            font-weight: 600;
            font-size: 0.85rem;
        }
        td {
            padding: 12px 10px;
            border-bottom: 1px solid #eef2f7;
        }
        tr:nth-child(even) { background: #f8fafc; }
        tr:hover { background: #eef4fa; }
        .welcome-banner {
            background: linear-gradient(135deg, #e6f0fa, #d4e4f5);
            padding: 20px 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .welcome-banner .greeting {
            font-size: 1.3rem;
            font-weight: 600;
            color: #1a3c5e;
        }
        .welcome-banner .greeting span {
            color: #2a6b9e;
        }
        .welcome-banner .employee-id {
            font-size: 0.9rem;
            color: #4a6a85;
            background: white;
            padding: 4px 14px;
            border-radius: 20px;
        }
        .loading {
            text-align: center;
            color: #4a6a85;
            padding: 40px;
            font-size: 1.1rem;
        }
        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 4px solid #dce4ec;
            border-top-color: #1a3c5e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 12px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hidden { display: none !important; }
        .readonly-badge {
            display: inline-block;
            background: #eef2f7;
            color: #4a6a85;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 0.7rem;
            margin-left: 8px;
        }
        .col-ref {
            font-size: 0.65rem;
            color: #7a8a9a;
            font-weight: 400;
            margin-left: 4px;
        }
        @media (max-width: 600px) {
            .container { padding: 15px; }
            th, td { padding: 8px 6px; font-size: 0.75rem; }
            .welcome-banner { flex-direction: column; gap: 10px; align-items: flex-start; }
            .welcome-banner .greeting { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <h1>📋 Attendance Portal</h1>

        <!-- Login Section -->
        <div id="loginSection">
            <div class="login-form">
                <div id="loginError" class="error-msg"></div>
                <div id="loginSuccess" class="success-msg"></div>
                <label>👤 Employee ID</label>
                <input type="text" id="employeeId" placeholder="Enter your Employee ID">
                <label>🔒 Password</label>
                <input type="password" id="password" placeholder="Enter your password">
                <button id="loginBtn">🔑 Sign In</button>
            </div>
        </div>

        <!-- Dashboard -->
        <div id="dashboardSection" class="hidden">
            <div class="welcome-banner">
                <div>
                    <div class="greeting">👋 Welcome, <span id="userName">Employee</span></div>
                    <div style="font-size:0.85rem;color:#4a6a85;margin-top:4px;">
                        <span id="userSector">Sector</span> • <span id="userProject">Project</span>
                    </div>
                </div>
                <div style="display:flex;align-items:center;flex-wrap:wrap;gap:8px;">
                    <span class="employee-id" id="userEmpId">ID: ---</span>
                    <span class="readonly-badge">🔒 View Only</span>
                    <button class="refresh-btn" id="refreshBtn">🔄 Refresh</button>
                    <button class="logout-btn" id="logoutBtn">🚪 Logout</button>
                </div>
            </div>
            <div id="attendanceTableWrap">
                <div id="loadingMsg" class="loading">
                    <span class="spinner"></span> Loading your attendance data...
                </div>
                <div id="tableContainer" class="hidden">
                    <div style="margin-bottom:12px;font-size:0.85rem;color:#4a6a85;background:#f0f4f8;padding:10px 16px;border-radius:6px;">
                        📊 <strong>Your Attendance Summary for the Month</strong>
                    </div>
                    <table>
                        <thead id="tableHead"></thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ======================================================================
        // CONFIGURATION - Your Google Apps Script URL
        // ======================================================================
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzD2ULvR2X3E16kzOq19JL5ILvm1edsWGE97hhYdDNi_Thq9Iowxwoec2MEKaxxEmn4/exec';

        // ======================================================================
        // COLUMN MAPPING (0-based indices from your "main" sheet)
        // ======================================================================
        const COL_EMPLOYEE_ID = 4;
        const COL_PASSWORD = 5;
        const COL_NAME = 6;          // G
        const COL_SECTOR = 3;        // D
        const COL_PROJECT = 7;       // H
        const COL_DAYS_IN_MONTH = 39; // AN
        const COL_HOLIDAYS = 40;      // AO
        const COL_LEAVE = 41;         // AP
        const COL_LWP = 42;           // AQ
        const COL_PRESENT = 43;       // AR
        const COL_PAYABLE = 44;       // AS
        const COL_CL = 45;            // AT
        const COL_ML = 46;            // AU

        // Display configuration
        const DISPLAY_FIELDS = [
            { header: 'Employee Name', col: COL_NAME, ref: 'G' },
            { header: 'Sector', col: COL_SECTOR, ref: 'D' },
            { header: 'Associated Project', col: COL_PROJECT, ref: 'H' },
            { header: 'No of Days in the Month', col: COL_DAYS_IN_MONTH, ref: 'AN' },
            { header: 'No of Holidays (Including Sundays)', col: COL_HOLIDAYS, ref: 'AO' },
            { header: 'No of Days on Leave', col: COL_LEAVE, ref: 'AP' },
            { header: 'No of Leave without Pay (LWP)', col: COL_LWP, ref: 'AQ' },
            { header: 'No of Days Present', col: COL_PRESENT, ref: 'AR' },
            { header: 'Total Payable Days', col: COL_PAYABLE, ref: 'AS' },
            { header: 'CL', col: COL_CL, ref: 'AT' },
            { header: 'ML', col: COL_ML, ref: 'AU' }
        ];

        // ======================================================================
        // DOM references
        // ======================================================================
        const loginSection = document.getElementById('loginSection');
        const dashboardSection = document.getElementById('dashboardSection');
        const loginError = document.getElementById('loginError');
        const loginSuccess = document.getElementById('loginSuccess');
        const employeeIdInput = document.getElementById('employeeId');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const refreshBtn = document.getElementById('refreshBtn');
        const userName = document.getElementById('userName');
        const userSector = document.getElementById('userSector');
        const userProject = document.getElementById('userProject');
        const userEmpId = document.getElementById('userEmpId');
        const loadingMsg = document.getElementById('loadingMsg');
        const tableContainer = document.getElementById('tableContainer');
        const tableHead = document.getElementById('tableHead');
        const tableBody = document.getElementById('tableBody');

        let currentEmployee = null;
        let currentRowData = null;

        // ======================================================================
        // API Calls
        // ======================================================================
        async function callScript(params) {
            const url = new URL(SCRIPT_URL);
            Object.keys(params).forEach(key => url.searchParams.append(key, params[key]));
            
            try {
                const response = await fetch(url.toString());
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                return await response.json();
            } catch (error) {
                console.error('API Error:', error);
                throw new Error('Failed to connect to server. Please check your internet connection.');
            }
        }

        async function login(empId, pwd) {
            return callScript({ action: 'login', id: empId, pwd: pwd });
        }

        async function refreshData(empId) {
            return callScript({ action: 'getData', id: empId });
        }

        // ======================================================================
        // Login Handler
        // ======================================================================
        async function handleLogin() {
            const empId = employeeIdInput.value.trim();
            const pwd = passwordInput.value.trim();

            if (!empId || !pwd) {
                showError('⚠️ Please enter both Employee ID and Password.');
                return;
            }

            hideError();
            loginBtn.disabled = true;
            loginBtn.textContent = '⏳ Logging in...';
            showSuccess('⏳ Authenticating...');

            try {
                const result = await login(empId, pwd);
                
                if (result.success) {
                    currentEmployee = result.employee;
                    currentRowData = result.rowData || null;
                    
                    console.log('✅ Login successful!');
                    console.log('Employee:', currentEmployee);
                    console.log('Row Data:', currentRowData);
                    
                    showDashboard();
                    hideSuccess();
                    showSuccess('✅ Login successful! Loading your data...');
                    setTimeout(hideSuccess, 2000);
                } else {
                    showError('❌ ' + (result.error || 'Invalid credentials. Please check your Employee ID and Password.'));
                    hideSuccess();
                }
            } catch (error) {
                showError('⚠️ ' + error.message);
                hideSuccess();
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = '🔑 Sign In';
            }
        }

        // ======================================================================
        // Dashboard
        // ======================================================================
        function showDashboard() {
            loginSection.classList.add('hidden');
            dashboardSection.classList.remove('hidden');
            
            userName.textContent = currentEmployee.name || 'Employee';
            userSector.textContent = currentEmployee.sector || 'N/A';
            userProject.textContent = currentEmployee.project || 'N/A';
            userEmpId.textContent = 'ID: ' + (currentEmployee.id || '---');
            
            renderAttendanceTable();
        }

        async function renderAttendanceTable() {
            loadingMsg.classList.remove('hidden');
            tableContainer.classList.add('hidden');

            try {
                let rowData;
                
                if (currentRowData && Object.keys(currentRowData).length > 0) {
                    rowData = currentRowData;
                } else {
                    const result = await refreshData(currentEmployee.id);
                    if (result.success) {
                        rowData = result.rowData || result.employee;
                    } else {
                        throw new Error(result.error || 'Failed to load data');
                    }
                }

                // Build headers
                let headersHtml = '<tr>';
                DISPLAY_FIELDS.forEach(field => {
                    headersHtml += `<th>${field.header} <span class="col-ref">(${field.ref})</span></th>`;
                });
                headersHtml += '</tr>';
                tableHead.innerHTML = headersHtml;

                // Build row
                let rowHtml = '<tr>';
                DISPLAY_FIELDS.forEach(field => {
                    const key = field.col.toString();
                    const value = (rowData[key] !== undefined && rowData[key] !== '') 
                        ? rowData[key] 
                        : '—';
                    rowHtml += `<td>${value}</td>`;
                });
                rowHtml += '</tr>';
                tableBody.innerHTML = rowHtml;

                loadingMsg.classList.add('hidden');
                tableContainer.classList.remove('hidden');
            } catch (error) {
                console.error('Error loading data:', error);
                loadingMsg.innerHTML = `⚠️ ${error.message} <button onclick="renderAttendanceTable()" style="margin-left:10px;padding:6px 16px;border:none;border-radius:4px;background:#1a3c5e;color:white;cursor:pointer;">Retry</button>`;
            }
        }

        // ======================================================================
        // UI Helpers
        // ======================================================================
        function showError(msg) {
            loginError.textContent = msg;
            loginError.style.display = 'block';
        }
        function hideError() {
            loginError.style.display = 'none';
        }
        function showSuccess(msg) {
            loginSuccess.textContent = msg;
            loginSuccess.style.display = 'block';
        }
        function hideSuccess() {
            loginSuccess.style.display = 'none';
        }

        // ======================================================================
        // Logout & Refresh
        // ======================================================================
        function handleLogout() {
            currentEmployee = null;
            currentRowData = null;
            dashboardSection.classList.add('hidden');
            loginSection.classList.remove('hidden');
            employeeIdInput.value = '';
            passwordInput.value = '';
            hideError();
            hideSuccess();
            tableBody.innerHTML = '';
            tableHead.innerHTML = '';
        }

        async function handleRefresh() {
            currentRowData = null;
            loadingMsg.classList.remove('hidden');
            tableContainer.classList.add('hidden');
            await renderAttendanceTable();
            showSuccess('✅ Data refreshed successfully!');
            setTimeout(hideSuccess, 2000);
        }

        // ======================================================================
        // Event Listeners
        // ======================================================================
        loginBtn.addEventListener('click', handleLogin);
        logoutBtn.addEventListener('click', handleLogout);
        refreshBtn.addEventListener('click', handleRefresh);

        employeeIdInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') loginBtn.click(); });
        passwordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') loginBtn.click(); });

        console.log('✅ Attendance Portal loaded successfully!');
        console.log(`🔗 Connected to: ${SCRIPT_URL}`);
        console.log('📊 Column Mapping:', DISPLAY_FIELDS);
    </script>
</body>
</html>
